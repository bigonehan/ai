[package]
name = "grist"
version = "0.0.10"
edition = "2021"
description = "Grist access CLI for the extensions workflow"

[[bin]]
name = "grist"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

